<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <title>Qaza Pro Logo Generator</title>
</head>
<body style="background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #fff;">

  <canvas id="qazaCanvas" width="512" height="512" style="border-radius: 64px; box-shadow: 0 12px 35px rgba(0,0,0,0.8);"></canvas>
  <br>
  <button id="downloadBtn" style="padding: 12px 28px; font-size: 16px; font-weight: bold; background: #25e26b; color: #07231c; border: none; border-radius: 12px; cursor: pointer;">
    Download icon.png
  </button>

  <script>
    const canvas = document.getElementById('qazaCanvas');
    const ctx = canvas.getContext('2d');

    // 1. Rich Dark Emerald & Black Gradient Background
    const bgGrad = ctx.createRadialGradient(256, 256, 40, 256, 256, 320);
    bgGrad.addColorStop(0, '#0d3b30');
    bgGrad.addColorStop(0.7, '#07231c');
    bgGrad.addColorStop(1, '#020d0a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, 512, 512);

    // 2. Subtle Outer Neon Ring
    ctx.beginPath();
    ctx.arc(256, 256, 205, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(37, 226, 107, 0.25)';
    ctx.lineWidth = 10;
    ctx.stroke();

    // 3. Islamic Arch / Mihrab Shape in Center
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(170, 360);
    ctx.lineTo(170, 250);
    ctx.bezierCurveTo(170, 160, 256, 120, 256, 120);
    ctx.bezierCurveTo(256, 120, 342, 160, 342, 250);
    ctx.lineTo(342, 360);
    ctx.closePath();

    ctx.fillStyle = 'rgba(4, 25, 20, 0.85)';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#ffb703'; // Gold accent border
    ctx.shadowColor = 'rgba(255, 183, 3, 0.4)';
    ctx.shadowBlur = 18;
    ctx.stroke();
    ctx.restore();

    // 4. Crescent & Star (Chanda-Tara) Symbol
    ctx.save();
    ctx.shadowColor = '#25e26b';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#25e26b';

    // Crescent Moon
    ctx.beginPath();
    ctx.arc(256, 210, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(270, 200, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // Small Star
    ctx.save();
    ctx.fillStyle = '#ffb703';
    ctx.beginPath();
    ctx.arc(235, 195, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 5. App Title: "QAZA"
    ctx.font = 'bold 56px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.letterSpacing = '4px';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 8;
    ctx.fillText('QAZA', 256, 305);

    // 6. Sub-badge: "PRO"
    ctx.beginPath();
    ctx.roundRect(206, 325, 100, 34, 10);
    ctx.fillStyle = '#25e26b';
    ctx.shadowColor = '#25e26b';
    ctx.shadowBlur = 12;
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillStyle = '#051913';
    ctx.letterSpacing = '2px';
    ctx.fillText('PRO', 256, 349);

    // Download Handler
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'icon.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // Auto download on file open
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('downloadBtn').click();
      }, 400);
    });
  </script>
</body>
</html>
